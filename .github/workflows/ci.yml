name: CI Build

on:
  push:
    branches:
      - master
      - develop/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_PATH: src/managed/writer.sln
  OLW_CONFIG: Release

jobs:
  build:
    name: Build Open Live Writer (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate version info
        # GlobalAssemblyVersionInfo.cs is generated, not committed — the build
        # fails without it on a fresh checkout. getversion.cmd is a dead
        # truncated stub, so generate the file directly from version.txt.
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Set-Content src/managed/GlobalAssemblyVersionInfo.cs `
            "[assembly: System.Reflection.AssemblyVersion(`"$v`")]", `
            "[assembly: System.Reflection.AssemblyFileVersion(`"$v`")]"

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        # dotnet msbuild == MSBuild with .NET 10 SDK support. The v143 C++
        # toolset (Ribbon project) ships with Visual Studio on windows-latest.
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo `
            /maxcpucount `
            /verbosity:minimal `
            /p:Configuration=${{ env.OLW_CONFIG }} `
            /p:PlatformToolset=v143

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiveWriter-Binaries-${{ github.run_number }}
          path: src/managed/bin/${{ env.OLW_CONFIG }}/x64/Writer/
          if-no-files-found: warn

  build-debug:
    name: Build Open Live Writer (Debug)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate version info
        # GlobalAssemblyVersionInfo.cs is generated, not committed — the build
        # fails without it on a fresh checkout. getversion.cmd is a dead
        # truncated stub, so generate the file directly from version.txt.
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Set-Content src/managed/GlobalAssemblyVersionInfo.cs `
            "[assembly: System.Reflection.AssemblyVersion(`"$v`")]", `
            "[assembly: System.Reflection.AssemblyFileVersion(`"$v`")]"

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution (Debug)
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo `
            /maxcpucount `
            /verbosity:minimal `
            /p:Configuration=Debug `
            /p:PlatformToolset=v143
