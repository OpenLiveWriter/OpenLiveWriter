name: CI Build

on:
  push:
    branches:
      - master
      - develop/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_PATH: src/managed/writer.Windows.slnf
  OLW_CONFIG: Release
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build Open Live Writer (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Install SignClient
        run: nuget install SignClient -Version 0.9.0 -SolutionDir ${{ github.workspace }} -Verbosity quiet -ExcludeVersion

      - name: Generate version info
        # GlobalAssemblyVersionInfo.cs is generated, not committed; the build
        # fails without it on a fresh checkout. getversion.cmd only sets cmd
        # variables, so generate the file directly from version.txt.
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Set-Content src/managed/GlobalAssemblyVersionInfo.cs `
            "[assembly: System.Reflection.AssemblyVersion(`"$v`")]", `
            "[assembly: System.Reflection.AssemblyFileVersion(`"$v`")]"

      - name: Generate GoogleBloggerv3Secrets.json
        # Embedded by BlogClient, gitignored (contains OAuth credentials).
        # Synthesized from CI secrets; empty strings when unset (dev builds
        # simply can't use Blogger auth).
        env:
          OLW_BLOGGER_CLIENT_ID: ${{ secrets.OLW_BLOGGER_CLIENT_ID }}
          OLW_BLOGGER_CLIENT_SECRET: ${{ secrets.OLW_BLOGGER_CLIENT_SECRET }}
        run: |
          $json = @{
            installed = @{
              client_id = "$env:OLW_BLOGGER_CLIENT_ID"
              project_id = "open-live-writer"
              auth_uri = "https://accounts.google.com/o/oauth2/auth"
              token_uri = "https://oauth2.googleapis.com/token"
              auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
              client_secret = "$env:OLW_BLOGGER_CLIENT_SECRET"
              redirect_uris = @("http://localhost")
            }
          } | ConvertTo-Json -Depth 5
          Set-Content src/managed/OpenLiveWriter.BlogClient/Clients/GoogleBloggerv3Secrets.json $json

      - name: Generate Markets.xml
        # CoreServices embeds Marketization/Markets.xml (gitignored, generated
        # from intl/markets by MarketXmlGenerator) and Marketization/Master.xml
        # (gitignored, copied from intl/markets). Produce both before build.
        run: |
          dotnet build src/managed/MarketXmlGenerator/MarketXmlGenerator.csproj -c Release --nologo -v minimal
          dotnet run --project src/managed/MarketXmlGenerator/MarketXmlGenerator.csproj -c Release --no-build -- intl/markets src/managed/OpenLiveWriter.CoreServices/Marketization/Markets.xml
          Copy-Item intl/markets/Master.xml src/managed/OpenLiveWriter.CoreServices/Marketization/Master.xml

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        # dotnet msbuild == MSBuild with .NET 10 SDK support. The v143 C++
        # toolset (Ribbon project) ships with Visual Studio on windows-latest.
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo `
            /maxcpucount `
            /verbosity:minimal `
            /p:Configuration=${{ env.OLW_CONFIG }} `
            /p:PlatformToolset=v143

      - name: Package with Velopack (signed)
        # vpk signs the app binaries and the Setup.exe via SignClient when the
        # secrets are available (not the case for fork PRs).
        if: env.SIGN_CLIENT_SECRET != ''
        shell: cmd
        env:
          SIGN_CLIENT_SECRET: ${{ secrets.SignClientSecret }}
          SIGN_CLIENT_USER: ${{ secrets.SignClientUser }}
        run: |
          call getversion.cmd
          vpk pack ^
            --packId OpenLiveWriter ^
            --packVersion %dottedVersion% ^
            --packTitle "Open Live Writer" ^
            --packDir src\managed\OpenLiveWriter\bin\%OLW_CONFIG% ^
            --mainExe OpenLiveWriter.exe ^
            --icon src\managed\OpenLiveWriter.PostEditor\Images\Writer.ico ^
            --channel stable ^
            --outputDir Releases ^
            --shortcuts Desktop,StartMenuRoot ^
            --skipVeloAppCheck ^
            --signTemplate "dotnet %GITHUB_WORKSPACE%\packages\SignClient\tools\netcoreapp2.0\SignClient.dll sign -c %GITHUB_WORKSPACE%\SignClient\appsettings.json -i {{file}} -r %SIGN_CLIENT_USER% -s %SIGN_CLIENT_SECRET% -n ""Open Live Writer"" -d ""Open Live Writer"" -u ""http://openlivewriter.com"""

      - name: Package with Velopack (unsigned)
        if: env.SIGN_CLIENT_SECRET == ''
        shell: cmd
        env:
          SIGN_CLIENT_SECRET: ${{ secrets.SignClientSecret }}
        run: |
          call getversion.cmd
          vpk pack ^
            --packId OpenLiveWriter ^
            --packVersion %dottedVersion% ^
            --packTitle "Open Live Writer" ^
            --packDir src\managed\OpenLiveWriter\bin\%OLW_CONFIG% ^
            --mainExe OpenLiveWriter.exe ^
            --icon src\managed\OpenLiveWriter.PostEditor\Images\Writer.ico ^
            --channel stable ^
            --outputDir Releases ^
            --shortcuts Desktop,StartMenuRoot ^
            --skipVeloAppCheck

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiveWriter-Installer-${{ github.run_number }}
          path: Releases/
          if-no-files-found: warn

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiveWriter-Binaries-${{ github.run_number }}
          path: src/managed/OpenLiveWriter/bin/${{ env.OLW_CONFIG }}/
          if-no-files-found: warn

  build-debug:
    name: Build Open Live Writer (Debug)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate version info
        # GlobalAssemblyVersionInfo.cs is generated, not committed; the build
        # fails without it on a fresh checkout. getversion.cmd only sets cmd
        # variables, so generate the file directly from version.txt.
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Set-Content src/managed/GlobalAssemblyVersionInfo.cs `
            "[assembly: System.Reflection.AssemblyVersion(`"$v`")]", `
            "[assembly: System.Reflection.AssemblyFileVersion(`"$v`")]"

      - name: Generate GoogleBloggerv3Secrets.json
        # Embedded by BlogClient, gitignored (contains OAuth credentials).
        # Synthesized from CI secrets; empty strings when unset (dev builds
        # simply can't use Blogger auth).
        env:
          OLW_BLOGGER_CLIENT_ID: ${{ secrets.OLW_BLOGGER_CLIENT_ID }}
          OLW_BLOGGER_CLIENT_SECRET: ${{ secrets.OLW_BLOGGER_CLIENT_SECRET }}
        run: |
          $json = @{
            installed = @{
              client_id = "$env:OLW_BLOGGER_CLIENT_ID"
              project_id = "open-live-writer"
              auth_uri = "https://accounts.google.com/o/oauth2/auth"
              token_uri = "https://oauth2.googleapis.com/token"
              auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
              client_secret = "$env:OLW_BLOGGER_CLIENT_SECRET"
              redirect_uris = @("http://localhost")
            }
          } | ConvertTo-Json -Depth 5
          Set-Content src/managed/OpenLiveWriter.BlogClient/Clients/GoogleBloggerv3Secrets.json $json

      - name: Generate Markets.xml
        # CoreServices embeds Marketization/Markets.xml (gitignored, generated
        # from intl/markets by MarketXmlGenerator) and Marketization/Master.xml
        # (gitignored, copied from intl/markets). Produce both before build.
        run: |
          dotnet build src/managed/MarketXmlGenerator/MarketXmlGenerator.csproj -c Release --nologo -v minimal
          dotnet run --project src/managed/MarketXmlGenerator/MarketXmlGenerator.csproj -c Release --no-build -- intl/markets src/managed/OpenLiveWriter.CoreServices/Marketization/Markets.xml
          Copy-Item intl/markets/Master.xml src/managed/OpenLiveWriter.CoreServices/Marketization/Master.xml

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution (Debug)
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo `
            /maxcpucount `
            /verbosity:minimal `
            /p:Configuration=Debug `
            /p:PlatformToolset=v143
