name: Release

# version.txt drives everything. It holds MAJOR.MINOR.PATCH.BUILD; you maintain
# the semver by hand and this workflow stamps BUILD from the run number, commits
# it, and tags v<semver>. Nothing here reads a version off a tag.
#
# Derived values, and why they differ:
#   version.txt         0.7.0.1234        assemblies (AssemblyVersion/FileVersion)
#   tag / release       v0.7.0            one release per semver
#   Velopack version    0.7.0-alpha.1234  vpk rejects 4-part versions outright
#                                         ("must be a 3-part SemVer2 compliant
#                                         version string"), and a plain 0.7.0
#                                         every build would mean installed
#                                         clients never see an update
#   CFBundleShortVersionString  0.7.0     the key takes at most 3 components
#   CFBundleVersion             1234

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package without committing, tagging or publishing.
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOLUTION_PATH: src/managed/writer.Windows.slnf
  OLW_CONFIG: Release
  DOTNET_VERSION: '10.0.x'

jobs:
  prepare:
    name: Stamp version and tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      build: ${{ steps.v.outputs.build }}
      full: ${{ steps.v.outputs.full }}
      pack: ${{ steps.v.outputs.pack }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A tag needs real history behind it, and we push a commit back.
          fetch-depth: 0

      - name: Compute versions from version.txt
        id: v
        run: |
          raw="$(head -n 1 version.txt | tr -d '[:space:]')"
          case "$raw" in
            *.*.*.*|*.*.*) : ;;
            *) echo "::error::version.txt must be MAJOR.MINOR.PATCH[.BUILD], got '$raw'"; exit 1 ;;
          esac
          semver="$(echo "$raw" | cut -d. -f1-3)"
          build="${{ github.run_number }}"
          {
            echo "semver=$semver"
            echo "build=$build"
            echo "full=$semver.$build"
            echo "pack=$semver-alpha.$build"
            echo "tag=v$semver"
          } >> "$GITHUB_OUTPUT"
          echo "version.txt=$raw -> full=$semver.$build tag=v$semver pack=$semver-alpha.$build"

      - name: Refuse to reuse an existing tag
        if: ${{ !inputs.dry_run }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.v.outputs.tag }} already exists. Bump the semver in version.txt."
            exit 1
          fi

      - name: Stamp version.txt, commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          printf '%s\n' "${{ steps.v.outputs.full }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "release: ${{ steps.v.outputs.full }}"
          git tag -a "${{ steps.v.outputs.tag }}" -m "Open Live Writer ${{ steps.v.outputs.full }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.v.outputs.tag }}"

  windows:
    name: Windows (${{ needs.prepare.outputs.full }})
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp version.txt for this build
        # On a dry run nothing was committed, so write the computed version
        # locally; on a real run this is already what the tag contains.
        shell: bash
        run: printf '%s\n' "${{ needs.prepare.outputs.full }}" > version.txt

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          solution: ${{ env.SOLUTION_PATH }}
          blogger-client-id: ${{ secrets.OLW_BLOGGER_CLIENT_ID }}
          blogger-client-secret: ${{ secrets.OLW_BLOGGER_CLIENT_SECRET }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 0.0.1251

      - name: Build solution
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo /maxcpucount /verbosity:minimal `
            /p:Configuration=${{ env.OLW_CONFIG }} /p:PlatformToolset=v143

      - name: Test (OpenLiveWriter.Tests)
        run: >
          dotnet test src/managed/OpenLiveWriter.Tests/OpenLiveWriter.Tests.csproj
          --no-build --nologo -v minimal -c ${{ env.OLW_CONFIG }}

      - name: Test (OpenLiveWriter.UnitTest)
        run: >
          dotnet test src/managed/OpenLiveWriter.UnitTest/OpenLiveWriter.UnitTest.csproj
          --no-build --nologo -v minimal -c ${{ env.OLW_CONFIG }}

      - name: Setup MSBuild for the native ribbon DLL
        uses: microsoft/setup-msbuild@v2

      - name: Build native ribbon resource DLL
        shell: pwsh
        run: |
          $v = "${{ needs.prepare.outputs.full }}"
          Set-Content src/unmanaged/version.h ("#define FILE_VERSION " + ($v -replace '\.', ',') + "`n#define PRODUCT_VERSION $v")
          msbuild src\unmanaged\OpenLiveWriter.Ribbon\OpenLiveWriter.Ribbon.vcxproj /nologo /verbosity:minimal /p:Configuration=${{ env.OLW_CONFIG }} /p:Platform=x64
          Copy-Item "src\managed\bin\${{ env.OLW_CONFIG }}\x64\Writer\OpenLiveWriter.Ribbon.dll" "src\managed\OpenLiveWriter\bin\${{ env.OLW_CONFIG }}\"

      - name: Verify the build is not a Debug build
        shell: pwsh
        run: |
          dotnet run scripts/AssertReleaseBuild.cs -- "src/managed/OpenLiveWriter/bin/$env:OLW_CONFIG/OpenLiveWriter.dll"
          if ($LASTEXITCODE -ne 0) { throw "Refusing to package: the built app is not a Release build." }

      - name: Confirm the binaries carry the stamped version
        shell: pwsh
        run: |
          $fv = (Get-Item "src/managed/OpenLiveWriter/bin/$env:OLW_CONFIG/OpenLiveWriter.dll").VersionInfo.FileVersion
          if ($fv -ne "${{ needs.prepare.outputs.full }}") {
            throw "FileVersion is '$fv' but this release is ${{ needs.prepare.outputs.full }}."
          }
          Write-Host "FileVersion $fv"

      - name: Package with Velopack
        shell: cmd
        run: |
          if exist Releases rd /s /q Releases
          vpk pack ^
            --packId OpenLiveWriter ^
            --packVersion ${{ needs.prepare.outputs.pack }} ^
            --packTitle "Open Live Writer" ^
            --packDir src\managed\OpenLiveWriter\bin\%OLW_CONFIG% ^
            --mainExe OpenLiveWriter.exe ^
            --icon src\managed\OpenLiveWriter.PostEditor\Images\Writer.ico ^
            --channel stable ^
            --outputDir Releases ^
            --shortcuts Desktop,StartMenuRoot ^
            --skipVeloAppCheck

      - name: Rename setup for download consistency
        shell: cmd
        run: move /y Releases\OpenLiveWriter-stable-Setup.exe Releases\OpenLiveWriterSetup.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Releases/
          if-no-files-found: error

  macos:
    name: macOS (${{ needs.prepare.outputs.full }})
    needs: prepare
    runs-on: macos-14
    env:
      OLW_RID: osx-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp version.txt for this build
        run: printf '%s\n' "${{ needs.prepare.outputs.full }}" > version.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build (macOS solution filter)
        run: dotnet build src/managed/writer.macOS.slnf --nologo -v minimal

      - name: Headless test suite
        run: |
          dotnet test src/managed/OpenLiveWriter.EditorTests.Automated --nologo -v minimal
          dotnet test src/managed/OpenLiveWriter.Platform.Tests --nologo -v minimal

      - name: Publish macOS app bundle
        env:
          # CFBundleShortVersionString takes at most three components; the build
          # number goes to CFBundleVersion.
          OLW_VERSION: ${{ needs.prepare.outputs.semver }}
          OLW_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: bash build-mac.sh

      - name: Confirm the bundle carries the stamped version
        run: |
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "artifacts/mac-arm64/Open Live Writer.app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "artifacts/mac-arm64/Open Live Writer.app/Contents/Info.plist")
          [ "$short" = "${{ needs.prepare.outputs.semver }}" ] || { echo "::error::CFBundleShortVersionString is $short"; exit 1; }
          [ "$build" = "${{ needs.prepare.outputs.build }}" ] || { echo "::error::CFBundleVersion is $build"; exit 1; }
          echo "Info.plist $short ($build)"

      # Signing and notarization slot in here, before the zip and DMG are made,
      # because stapling mutates the .app. See mac-build.yml for the steps and
      # the secrets they need; they are omitted until the certificates exist.

      - name: Zip app bundle
        run: |
          cd artifacts/mac-arm64
          ditto -c -k --keepParent "Open Live Writer.app" "Open Live Writer.zip"

      - name: Create DMG
        run: |
          bash packaging/mac/create-dmg.sh \
            "artifacts/mac-arm64/Open Live Writer.app" \
            "artifacts/mac-arm64/Open Live Writer.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/mac-arm64/Open Live Writer.zip
            artifacts/mac-arm64/Open Live Writer.dmg
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, windows, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish one release with both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: Open Live Writer ${{ needs.prepare.outputs.full }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          gh release create "$TAG" --title "$TITLE" --generate-notes $PRERELEASE \
            || gh release view "$TAG" >/dev/null
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
