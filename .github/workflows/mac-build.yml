name: macOS Build

on:
  push:
    branches:
      - master
      - develop/**
      - milestone4/**
  pull_request:
    branches:
      - master
      - develop/**
  workflow_dispatch:

env:
  OLW_CONFIG: Release
  OLW_RID: osx-arm64

jobs:
  mac-build:
    name: Test, bundle, and package (macOS arm64)
    # Pin to an Apple Silicon runner for the osx-arm64 target (macos-latest
    # floats; keep the build deterministic).
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/managed/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # No "Generate version info" step: no managed project compiles
      # GlobalAssemblyVersionInfo.cs, so writing it here achieved nothing.
      # Directory.Build.props reads version.txt directly.

      - name: Build (macOS solution filter)
        run: dotnet build src/managed/writer.macOS.slnf --nologo -v minimal

      - name: Headless test suite
        # 800+ NUnit tests (Avalonia.Headless, AngleSharp, publishing logic).
        # Gates the bundle: no artifacts ship from a red suite. Platform.Tests
        # is in writer.macOS.slnf and was being built but never run.
        run: |
          dotnet test src/managed/OpenLiveWriter.EditorTests.Automated --nologo -v minimal \
            --logger "trx;LogFileName=EditorTests.Automated.trx" \
            --results-directory artifacts/test-results
          dotnet test src/managed/OpenLiveWriter.Platform.Tests --nologo -v minimal \
            --logger "trx;LogFileName=Platform.Tests.trx" \
            --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-macOS-${{ github.run_number }}
          path: artifacts/test-results/
          if-no-files-found: warn

      - name: Install Velopack CLI
        # vpk 0.0.1251 targets .NET 9 and the runner has 10; build-mac.sh sets
        # DOTNET_ROLL_FORWARD so the tool starts anyway.
        run: dotnet tool install -g vpk --version 0.0.1251

      - name: Build the app bundle and installer
        env:
          OLW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash build-mac.sh

      # Signing, notarization and release publishing all moved to release.yml,
      # which packs with the same script. This workflow is CI only: build and
      # run the suites on every push and PR.

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiveWriter-macOS-arm64-${{ github.run_number }}
          # The .pkg installer plus the update-feed assets vpk emits.
          path: artifacts/mac-arm64/Releases/
          if-no-files-found: error
          retention-days: 30
