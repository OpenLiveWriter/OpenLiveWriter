name: Windows Release

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: src/managed/writer.Windows.slnf
  OLW_CONFIG: Release
  DOTNET_VERSION: '10.0.x'

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          solution: ${{ env.SOLUTION_PATH }}
          blogger-client-id: ${{ secrets.OLW_BLOGGER_CLIENT_ID }}
          blogger-client-secret: ${{ secrets.OLW_BLOGGER_CLIENT_SECRET }}

      - name: Install Velopack CLI
        # vpk version must match the Velopack NuGet package (Directory.Packages.props)
        run: dotnet tool install -g vpk --version 0.0.1251

      - name: Install SignClient
        run: nuget install SignClient -Version 0.9.0 -SolutionDir ${{ github.workspace }} -Verbosity quiet -ExcludeVersion

      - name: Build solution
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} `
            /nologo `
            /maxcpucount `
            /verbosity:minimal `
            /p:Configuration=${{ env.OLW_CONFIG }} `
            /p:PlatformToolset=v143

      # A tag build publishes straight to a GitHub Release, so it is the last
      # place that should skip the suite. One step per project: pwsh does not
      # stop on a native non-zero exit, so two calls in one step would report
      # only the last exit code.
      - name: Test (OpenLiveWriter.Tests)
        run: >
          dotnet test src/managed/OpenLiveWriter.Tests/OpenLiveWriter.Tests.csproj
          --no-build --nologo -v minimal -c ${{ env.OLW_CONFIG }}
          --logger "trx;LogFileName=OpenLiveWriter.Tests.trx"
          --results-directory artifacts/test-results

      - name: Test (OpenLiveWriter.UnitTest)
        run: >
          dotnet test src/managed/OpenLiveWriter.UnitTest/OpenLiveWriter.UnitTest.csproj
          --no-build --nologo -v minimal -c ${{ env.OLW_CONFIG }}
          --logger "trx;LogFileName=OpenLiveWriter.UnitTest.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-Release-${{ github.run_number }}
          path: artifacts/test-results/
          if-no-files-found: warn

      - name: Setup MSBuild for the native ribbon DLL
        uses: microsoft/setup-msbuild@v2

      - name: Build native ribbon resource DLL
        # OpenLiveWriter.Ribbon.dll carries the compiled Windows Ribbon markup
        # used by the Labs "classic Windows ribbon" option. It must sit next to
        # OpenLiveWriter.exe so vpk packs it below.
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Set-Content src/unmanaged/version.h ("#define FILE_VERSION " + ($v -replace '\.', ',') + "`n#define PRODUCT_VERSION $v")
          msbuild src\unmanaged\OpenLiveWriter.Ribbon\OpenLiveWriter.Ribbon.vcxproj /nologo /verbosity:minimal /p:Configuration=${{ env.OLW_CONFIG }} /p:Platform=x64
          Copy-Item "src\managed\bin\${{ env.OLW_CONFIG }}\x64\Writer\OpenLiveWriter.Ribbon.dll" "src\managed\OpenLiveWriter\bin\${{ env.OLW_CONFIG }}\"

      - name: Verify the build is not a Debug build
        # The installer is what users run, so assert it from the assembly itself
        # rather than trusting that OLW_CONFIG survived the build plumbing.
        shell: pwsh
        run: |
          if ($env:OLW_CONFIG -ne 'Release') {
            throw "OLW_CONFIG is '$env:OLW_CONFIG'; releases must be packed from Release binaries."
          }
          dotnet run scripts/AssertReleaseBuild.cs -- "src/managed/OpenLiveWriter/bin/$env:OLW_CONFIG/OpenLiveWriter.dll"
          if ($LASTEXITCODE -ne 0) { throw "Refusing to publish: the built app is not a Release build." }

      - name: Package with Velopack (signed)
        # vpk signs the app binaries and the Setup.exe via SignClient when the
        # secrets are available (not the case for fork PRs). Releases/ is
        # cleaned first: the PostBuild.CreateInstaller project already packed
        # this version during the solution build, and vpk refuses to pack an
        # equal-or-greater version.
        if: env.SIGN_CLIENT_SECRET != ''
        shell: cmd
        env:
          SIGN_CLIENT_SECRET: ${{ secrets.SignClientSecret }}
          SIGN_CLIENT_USER: ${{ secrets.SignClientUser }}
        run: |
          if exist Releases rd /s /q Releases
          call getversion.cmd
          vpk pack ^
            --packId OpenLiveWriter ^
            --packVersion %dottedVersion% ^
            --packTitle "Open Live Writer" ^
            --packDir src\managed\OpenLiveWriter\bin\%OLW_CONFIG% ^
            --mainExe OpenLiveWriter.exe ^
            --icon src\managed\OpenLiveWriter.PostEditor\Images\Writer.ico ^
            --channel stable ^
            --outputDir Releases ^
            --shortcuts Desktop,StartMenuRoot ^
            --skipVeloAppCheck ^
            --signTemplate "dotnet %GITHUB_WORKSPACE%\packages\SignClient\tools\netcoreapp2.0\SignClient.dll sign -c %GITHUB_WORKSPACE%\SignClient\appsettings.json -i {{file}} -r %SIGN_CLIENT_USER% -s %SIGN_CLIENT_SECRET% -n ""Open Live Writer"" -d ""Open Live Writer"" -u ""http://openlivewriter.com"""

      - name: Package with Velopack (unsigned)
        # Releases/ is cleaned first: the PostBuild.CreateInstaller project
        # already packed this version during the solution build, and vpk
        # refuses to pack an equal-or-greater version.
        if: env.SIGN_CLIENT_SECRET == ''
        shell: cmd
        env:
          SIGN_CLIENT_SECRET: ${{ secrets.SignClientSecret }}
        run: |
          if exist Releases rd /s /q Releases
          call getversion.cmd
          vpk pack ^
            --packId OpenLiveWriter ^
            --packVersion %dottedVersion% ^
            --packTitle "Open Live Writer" ^
            --packDir src\managed\OpenLiveWriter\bin\%OLW_CONFIG% ^
            --mainExe OpenLiveWriter.exe ^
            --icon src\managed\OpenLiveWriter.PostEditor\Images\Writer.ico ^
            --channel stable ^
            --outputDir Releases ^
            --shortcuts Desktop,StartMenuRoot ^
            --skipVeloAppCheck

      - name: Rename setup for download consistency
        shell: cmd
        run: |
          move /y Releases\OpenLiveWriter-stable-Setup.exe Releases\OpenLiveWriterSetup.exe

      - name: Publish GitHub Release
        # Tags only. Without this guard a workflow_dispatch run on any branch
        # cut a prerelease named after the branch ref and uploaded installers
        # to it; dispatch is now a safe build/test/package dry run.
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env rather than inlined into the script: ref_name is attacker-
          # influenced input in the general case, and this runs a shell.
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:TAG" --title "Open Live Writer $env:TAG" --generate-notes --prerelease || gh release view "$env:TAG"
          gh release upload "$env:TAG" Releases/* --clobber
