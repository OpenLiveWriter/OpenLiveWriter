<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        padding: 20px 24px;
        min-height: 100vh;
        outline: none;
    }
    body:empty:before {
        content: 'Start writing your blog post...';
        color: #999;
        font-style: italic;
    }
    h1 { font-size: 2em; margin: 0.5em 0; font-weight: 600; }
    h2 { font-size: 1.5em; margin: 0.5em 0; font-weight: 600; }
    h3 { font-size: 1.25em; margin: 0.5em 0; font-weight: 600; }
    p { margin: 0.5em 0; }
    a { color: #0066cc; }
    blockquote {
        border-left: 3px solid #ddd;
        padding-left: 16px;
        margin: 1em 0;
        color: #666;
    }
    pre {
        background: #f5f5f5;
        padding: 12px 16px;
        border-radius: 4px;
        overflow-x: auto;
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 14px;
    }
    code {
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 0.9em;
    }
    img { max-width: 100%; height: auto; }
    ul, ol { padding-left: 24px; margin: 0.5em 0; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    td, th { border: 1px solid #ddd; padding: 8px 12px; }
    th { background: #f5f5f5; font-weight: 600; }
    hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
</style>
<script>
// OLW Editor Bridge - communicates between WebView and Avalonia app
// IMPORTANT: Script is in <head> so it doesn't contaminate body.innerHTML

var _savedSelection = null;

const OLWBridge = {
    // Save the current selection (call before focus leaves the editor)
    saveSelection: function() {
        var sel = window.getSelection();
        if (sel.rangeCount > 0) {
            _savedSelection = sel.getRangeAt(0).cloneRange();
        }
    },

    // Restore the saved selection and focus the editor
    restoreSelection: function() {
        document.body.focus();
        if (_savedSelection) {
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(_savedSelection);
        }
    },

    // Execute a formatting command (restores focus/selection first)
    execCommand: function(command, value) {
        this.restoreSelection();
        document.execCommand(command, false, value || null);
        this.saveSelection();
        this.reportState();
    },

    // Get current formatting state
    getState: function() {
        var ctx = this._selectionContext();
        return JSON.stringify({
            bold: document.queryCommandState('bold'),
            italic: document.queryCommandState('italic'),
            underline: document.queryCommandState('underline'),
            strikethrough: document.queryCommandState('strikeThrough'),
            subscript: document.queryCommandState('subscript'),
            superscript: document.queryCommandState('superscript'),
            orderedList: document.queryCommandState('insertOrderedList'),
            unorderedList: document.queryCommandState('insertUnorderedList'),
            alignLeft: document.queryCommandState('justifyLeft'),
            alignCenter: document.queryCommandState('justifyCenter'),
            alignRight: document.queryCommandState('justifyRight'),
            alignFull: document.queryCommandState('justifyFull'),
            blockTag: (document.queryCommandValue('formatBlock') || 'p').toLowerCase(),
            fontName: (document.queryCommandValue('fontName') || '').toString(),
            fontSize: this._caretFontSizePx(),
            foreColor: (document.queryCommandValue('foreColor') || '').toString(),
            backColor: (document.queryCommandValue('backColor') || document.queryCommandValue('hiliteColor') || '').toString(),
            inTable: ctx.inTable,
            selectedElementType: ctx.selectedElementType,
            image: ctx.image
        });
    },

    // Computed px font size at the caret (rounded), so the ribbon Font Size combo
    // can follow the caret in real pixel units rather than the HTML 1-7 scale.
    _caretFontSizePx: function() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return '';
        var node = sel.anchorNode;
        var el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
        if (!el) return '';
        var px = parseFloat(window.getComputedStyle(el).fontSize);
        return isNaN(px) ? '' : String(Math.round(px));
    },

    // Apply a pixel font size to the selection. With styleWithCSS on, WebKit's
    // execCommand('fontSize', 7) wraps the selection in a span whose inline
    // font-size is the xxx-large keyword; rewriting just those spans to the
    // requested px value yields a clean, predictable inline style.
    setFontSizePx: function(px) {
        px = parseInt(px, 10);
        if (!px || px <= 0) return;
        this.restoreSelection();
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('fontSize', false, '7');
        document.execCommand('styleWithCSS', false, false);
        var spans = document.body.querySelectorAll('span');
        for (var i = 0; i < spans.length; i++) {
            var fs = spans[i].style.fontSize || '';
            if (fs.indexOf('xxx-large') >= 0)
                spans[i].style.fontSize = px + 'px';
        }
        this.saveSelection();
        this.reportState();
    },

    // Inspect the current selection and report the contextual editing context:
    // whether the caret is inside a table cell, and whether it sits within a
    // recognized rich element (image, video embed, map embed, or tag anchor).
    // Drives the ribbon's contextual-tab activation. Returns a plain object.
    _selectionContext: function() {
        var ctx = { inTable: false, selectedElementType: null, image: null };
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return ctx;

        var img = this._selectedImage();
        if (img) {
            ctx.selectedElementType = 'image';
            ctx.image = this._imageState(img);
        }

        var range = sel.getRangeAt(0);

        // An image selected as a unit: the range wraps a single IMG node.
        if (!ctx.selectedElementType && !range.collapsed) {
            var frag = range.cloneContents();
            if (frag && frag.childNodes.length === 1 &&
                frag.childNodes[0].nodeType === 1 && frag.childNodes[0].tagName === 'IMG') {
                ctx.selectedElementType = 'image';
            }
        }

        var node = range.startContainer;
        var el = node.nodeType === 1 ? node : node.parentNode;
        while (el && el !== document.body) {
            var tag = el.tagName;
            if (tag === 'TD' || tag === 'TH') ctx.inTable = true;
            if (!ctx.selectedElementType) {
                var cls = el.classList;
                if (tag === 'IMG') ctx.selectedElementType = 'image';
                else if (cls && cls.contains('olw-video')) ctx.selectedElementType = 'video';
                else if (cls && cls.contains('olw-map')) ctx.selectedElementType = 'map';
                else if (tag === 'A' && (el.getAttribute('rel') || '').indexOf('tag') >= 0)
                    ctx.selectedElementType = 'tag';
            }
            el = el.parentNode;
        }
        return ctx;
    },

    // Toggle a block-level format (e.g. blockquote). Applying the same
    // tag again reverts the block back to a normal paragraph, matching the
    // toggle-button behavior of the native ribbon.
    toggleBlock: function(tag) {
        this.restoreSelection();
        var current = (document.queryCommandValue('formatBlock') || '').toLowerCase();
        var target = tag.toLowerCase();
        document.execCommand('formatBlock', false, current === target ? 'p' : target);
        this.saveSelection();
        this.reportState();
    },

    // Apply a highlight (background) color to the selection. Prefers CSS-backed
    // hiliteColor (honored by WebKit) and falls back to backColor.
    setHighlight: function(color) {
        if (!color) return;
        this.restoreSelection();
        document.execCommand('styleWithCSS', false, true);
        if (!document.execCommand('hiliteColor', false, color)) {
            document.execCommand('backColor', false, color);
        }
        document.execCommand('styleWithCSS', false, false);
        this.saveSelection();
        this.reportState();
    },

    // Insert a hyperlink around the current selection.
    createLink: function(url) {
        if (!url) return;
        this.restoreSelection();
        document.execCommand('createLink', false, url);
        this.saveSelection();
        this.reportState();
    },

    // Post a message string to the native host. Supports the Avalonia WebView
    // bridge (window.invokeCSharpAction / postAvWebViewMessage) as well as the
    // WebView2 (window.chrome.webview) convention.
    postToHost: function(message) {
        try {
            if (typeof window.invokeCSharpAction === 'function') {
                window.invokeCSharpAction(message);
                return;
            }
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
                return;
            }
            if (window.webkit && window.webkit.messageHandlers &&
                window.webkit.messageHandlers.postAvWebViewMessage) {
                window.webkit.messageHandlers.postAvWebViewMessage.postMessage(message);
            }
        } catch(e) { /* silent */ }
    },

    // Report state to native app via message passing
    reportState: function() {
        var stateMsg = JSON.stringify({
            type: 'stateChanged',
            state: JSON.parse(this.getState())
        });
        this.postToHost(stateMsg);
    },

    // Get HTML content from the editor body
    getContent: function() {
        return document.body.innerHTML;
    },

    // Replace the editor body content with new HTML
    setContent: function(html) {
        this.hideResizeHandles();
        document.body.innerHTML = html;
    },

    // Get plain text content
    getPlainText: function() {
        return document.body.innerText;
    },

    // Insert HTML at the current cursor position
    insertHtml: function(html) {
        this.restoreSelection();
        document.execCommand('insertHTML', false, html);
        this.saveSelection();
        this.reportState();
    },

    // ---- Table operations (operate on the table containing the caret) ----

    // Returns the <td>/<th> cell containing the current selection, or null.
    _currentCell: function() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var node = sel.getRangeAt(0).startContainer;
        while (node && node !== document.body) {
            if (node.nodeType === 1 && (node.tagName === 'TD' || node.tagName === 'TH'))
                return node;
            node = node.parentNode;
        }
        return null;
    },

    // Inserts a row above/below the row containing the caret. Returns true on success.
    insertTableRow: function(below) {
        this.restoreSelection();
        var cell = this._currentCell();
        if (!cell) return false;
        var row = cell.parentNode;
        var newRow = row.cloneNode(true);
        for (var i = 0; i < newRow.cells.length; i++) newRow.cells[i].innerHTML = '';
        if (below) row.parentNode.insertBefore(newRow, row.nextSibling);
        else row.parentNode.insertBefore(newRow, row);
        this.reportState();
        return true;
    },

    // Deletes the row containing the caret. Returns true on success.
    deleteTableRow: function() {
        this.restoreSelection();
        var cell = this._currentCell();
        if (!cell) return false;
        var row = cell.parentNode;
        row.parentNode.removeChild(row);
        this.reportState();
        return true;
    },

    // Inserts a column left/right of the column containing the caret.
    insertTableColumn: function(right) {
        this.restoreSelection();
        var cell = this._currentCell();
        if (!cell) return false;
        var index = cell.cellIndex;
        var table = cell.closest('table');
        if (!table) return false;
        var rows = table.rows;
        for (var i = 0; i < rows.length; i++) {
            var ref = rows[i].cells[index];
            var isHeader = ref && ref.tagName === 'TH';
            var newCell = document.createElement(isHeader ? 'th' : 'td');
            rows[i].insertBefore(newCell, right ? (ref ? ref.nextSibling : null) : ref);
        }
        this.reportState();
        return true;
    },

    // Deletes the column containing the caret.
    deleteTableColumn: function() {
        this.restoreSelection();
        var cell = this._currentCell();
        if (!cell) return false;
        var index = cell.cellIndex;
        var table = cell.closest('table');
        if (!table) return false;
        var rows = table.rows;
        for (var i = 0; i < rows.length; i++) {
            if (rows[i].cells[index]) rows[i].deleteCell(index);
        }
        this.reportState();
        return true;
    },

    // Deletes the entire table containing the caret.
    deleteTable: function() {
        this.restoreSelection();
        var cell = this._currentCell();
        if (!cell) return false;
        var table = cell.closest('table');
        if (!table) return false;
        table.parentNode.removeChild(table);
        this.reportState();
        return true;
    },

    // ---- Image operations (operate on the <img> selected as a unit) ----

    // Returns the IMG element currently selected as a unit (single-node
    // selection, as produced by clicking an image), or null.
    _selectedImage: function() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var range = sel.getRangeAt(0);
        if (range.startContainer === range.endContainer &&
            range.endOffset === range.startOffset + 1 &&
            range.startContainer.nodeType === 1) {
            var node = range.startContainer.childNodes[range.startOffset];
            if (node && node.nodeType === 1 && node.tagName === 'IMG') return node;
        }
        return null;
    },

    // Selects an image as a unit (single-node selection, like Windows Live
    // Writer's picture selection) and reports the new state.
    selectImageUnit: function(img) {
        var range = document.createRange();
        range.selectNode(img);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        this.saveSelection();
        this.reportState();
    },

    // Parses an integer pixel value from a CSS length ("12px" -> 12), else null.
    _px: function(value) {
        var m = /^(\d+(?:\.\d+)?)px$/.exec(value || '');
        return m ? Math.round(parseFloat(m[1])) : null;
    },

    // Builds the attribute/style payload for the given image, consumed by the
    // host's FormatState (ribbon spinners, properties dialog prefill).
    _imageState: function(img) {
        if (!img) return null;
        var st = img.style;

        var alignment = 'inline';
        if (st.cssFloat === 'left' || st.cssFloat === 'right') alignment = st.cssFloat;
        else if (st.display === 'block' && st.marginLeft === 'auto' && st.marginRight === 'auto')
            alignment = 'center';

        var mt = this._px(st.marginTop), mr = this._px(st.marginRight),
            mb = this._px(st.marginBottom), ml = this._px(st.marginLeft);
        var margin = (mt !== null && mt === mr && mr === mb && mb === ml) ? mt : null;

        var rotation = 0;
        var rm = /rotate\((-?\d+(?:\.\d+)?)deg\)/.exec(st.transform || '');
        if (rm) rotation = Math.round(parseFloat(rm[1]));

        var borderWidth = this._px(st.borderTopWidth);

        var link = '';
        var parent = img.parentNode;
        if (parent && parent.tagName === 'A') link = parent.getAttribute('href') || '';

        var rect = img.getBoundingClientRect();
        return {
            src: img.getAttribute('src') || '',
            naturalWidth: img.naturalWidth || 0,
            naturalHeight: img.naturalHeight || 0,
            width: parseInt(img.getAttribute('width'), 10) || Math.round(rect.width) || img.naturalWidth || 0,
            height: parseInt(img.getAttribute('height'), 10) || Math.round(rect.height) || img.naturalHeight || 0,
            alt: img.getAttribute('alt') || '',
            title: img.getAttribute('title') || '',
            alignment: alignment,
            margin: margin,
            rotation: rotation,
            borderWidth: borderWidth,
            borderColor: borderWidth ? (st.borderTopColor || '') : null,
            link: link
        };
    },

    // Returns the selected image's attribute payload as JSON (null when none).
    getSelectedImage: function() {
        return JSON.stringify(this._imageState(this._selectedImage()));
    },

    // Applies attributes/styles to the selected image. Only keys present in
    // attrs are touched. width/height: a number sets both the attribute and a
    // matching inline style (the stylesheet's height:auto would otherwise
    // override the height attribute), null clears back to natural size.
    // margin: number sets a uniform px margin, 0/null clears. alignment:
    // inline/left/right/center. borderWidth + borderColor set a solid border
    // (0/null removes). rotation: degrees for a CSS transform (0 removes).
    applyImageAttrs: function(attrs) {
        if (!attrs) return false;
        this.restoreSelection();
        var img = this._selectedImage();
        if (!img) return false;
        var st = img.style;

        if (attrs.width !== undefined) {
            if (attrs.width === null) { img.removeAttribute('width'); st.width = ''; }
            else { img.setAttribute('width', attrs.width); st.width = attrs.width + 'px'; }
        }
        if (attrs.height !== undefined) {
            if (attrs.height === null) { img.removeAttribute('height'); st.height = ''; }
            else { img.setAttribute('height', attrs.height); st.height = attrs.height + 'px'; }
        }
        if (attrs.alt !== undefined) {
            if (attrs.alt) img.setAttribute('alt', attrs.alt); else img.removeAttribute('alt');
        }
        if (attrs.title !== undefined) {
            if (attrs.title) img.setAttribute('title', attrs.title); else img.removeAttribute('title');
        }
        if (attrs.alignment !== undefined || attrs.margin !== undefined) {
            var cur = this._imageState(img);
            var align = attrs.alignment !== undefined ? attrs.alignment : cur.alignment;
            var margin = attrs.margin !== undefined ? attrs.margin : cur.margin;
            st.cssFloat = '';
            st.display = '';
            st.marginTop = st.marginRight = st.marginBottom = st.marginLeft = '';
            if (align === 'left' || align === 'right') st.cssFloat = align;
            else if (align === 'center') {
                st.display = 'block';
                st.marginLeft = 'auto';
                st.marginRight = 'auto';
            }
            if (margin !== null && margin > 0) {
                st.marginTop = margin + 'px';
                st.marginBottom = margin + 'px';
                if (align !== 'center') {
                    st.marginLeft = margin + 'px';
                    st.marginRight = margin + 'px';
                }
            }
        }
        if (attrs.borderWidth !== undefined) {
            if (attrs.borderWidth === null || attrs.borderWidth <= 0) st.border = '';
            else st.border = attrs.borderWidth + 'px solid ' + (attrs.borderColor || '#999999');
        }
        if (attrs.rotation !== undefined) {
            if (!attrs.rotation) st.transform = '';
            else st.transform = 'rotate(' + attrs.rotation + 'deg)';
        }

        this.saveSelection();
        this.reportState();
        postContentChanged();
        this.layoutResizeHandles();
        return true;
    },

    // Wraps the selected image in (or retargets/removes) a link. A null/empty
    // url removes any wrapping anchor.
    setImageLink: function(url) {
        this.restoreSelection();
        var img = this._selectedImage();
        if (!img) return false;
        var parent = img.parentNode;
        if (parent && parent.tagName === 'A') {
            if (url) {
                parent.setAttribute('href', url);
            } else {
                var grand = parent.parentNode;
                grand.insertBefore(img, parent);
                grand.removeChild(parent);
            }
        } else if (url) {
            var a = document.createElement('a');
            a.setAttribute('href', url);
            img.parentNode.insertBefore(a, img);
            a.appendChild(img);
        }
        this.saveSelection();
        this.reportState();
        postContentChanged();
        return true;
    },

    // Replaces the selected image's pixels with a baked (re-encoded) source —
    // the host bakes crop/rotate/effects into PNG bytes and hands back a data
    // URI. sizeMode: 'keep' leaves the display size alone (color effects),
    // 'swap' swaps explicit width/height (90-degree rotation; when only one
    // dimension is explicit both are cleared so the baked natural size shows),
    // 'set' applies the given px width/height (crop/resize). Any CSS rotation
    // is cleared because the rotation is now baked into the pixels.
    // Note: WebView undo does not cover this bridge rewrite (documented,
    // best-effort limitation).
    replaceSelectedImageSrc: function(src, sizeMode, width, height) {
        this.restoreSelection();
        var img = this._selectedImage();
        if (!img) return false;
        img.setAttribute('src', src);
        img.style.transform = '';
        if (sizeMode === 'swap') {
            var w = img.getAttribute('width'), h = img.getAttribute('height');
            if (w !== null && h !== null) {
                img.setAttribute('width', parseInt(h, 10));
                img.setAttribute('height', parseInt(w, 10));
                img.style.width = parseInt(h, 10) + 'px';
                img.style.height = parseInt(w, 10) + 'px';
            } else {
                img.removeAttribute('width');
                img.removeAttribute('height');
                img.style.width = '';
                img.style.height = '';
            }
        } else if (sizeMode === 'set' && width > 0 && height > 0) {
            img.setAttribute('width', width);
            img.setAttribute('height', height);
            img.style.width = width + 'px';
            img.style.height = height + 'px';
        }
        this.saveSelection();
        this.reportState();
        postContentChanged();
        this.layoutResizeHandles();
        return true;
    },

    // ---- Corner-drag resize handles ----
    //
    // The handle layer lives OUTSIDE <body> (appended to <html>) so it overlays
    // the editable content without ever appearing in getContent()'s
    // body.innerHTML, and without being editable/selectable content itself.

    _resizeImage: null,
    _handleLayer: null,

    // Shows the handles when an image is selected as a unit, hides them
    // otherwise. Called from the selectionchange listener.
    updateResizeHandles: function() {
        var img = this._selectedImage();
        if (img) this.showResizeHandles(img);
        else this.hideResizeHandles();
    },

    showResizeHandles: function(img) {
        this._resizeImage = img;
        var layer = this._ensureHandleLayer();
        layer.style.display = 'block';
        this.layoutResizeHandles();
    },

    hideResizeHandles: function() {
        this._resizeImage = null;
        if (this._handleLayer) this._handleLayer.style.display = 'none';
    },

    // Repositions the handles on the selected image's corners. Called on
    // selectionchange, scroll (capture), window resize, and after image ops.
    layoutResizeHandles: function() {
        var img = this._resizeImage;
        if (!img || !this._handleLayer || this._handleLayer.style.display === 'none') return;
        if (!img.isConnected) { this.hideResizeHandles(); return; }
        var r = img.getBoundingClientRect();
        // 9px handles centered on the corners (nw, ne, sw, se order).
        var xs = [r.left - 4, r.right - 4, r.left - 4, r.right - 4];
        var ys = [r.top - 4, r.top - 4, r.bottom - 4, r.bottom - 4];
        var kids = this._handleLayer.childNodes;
        for (var i = 0; i < kids.length; i++) {
            kids[i].style.left = xs[i] + 'px';
            kids[i].style.top = ys[i] + 'px';
        }
    },

    _ensureHandleLayer: function() {
        if (this._handleLayer) return this._handleLayer;
        var layer = document.createElement('div');
        layer.setAttribute('data-olw-ui', 'resize-handles');
        layer.setAttribute('contenteditable', 'false');
        layer.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;' +
            'z-index:2147483647;pointer-events:none;display:none;margin:0;padding:0;';
        var corners = ['nw', 'ne', 'sw', 'se'];
        for (var i = 0; i < corners.length; i++) {
            var handle = document.createElement('div');
            handle.setAttribute('data-olw-corner', corners[i]);
            handle.style.cssText = 'position:absolute;width:9px;height:9px;background:#fff;' +
                'border:1px solid #0066cc;box-sizing:border-box;pointer-events:auto;' +
                'cursor:' + ((corners[i] === 'nw' || corners[i] === 'se') ? 'nwse-resize' : 'nesw-resize') + ';';
            (function(h, corner) {
                h.addEventListener('pointerdown', function(e) { OLWBridge.beginResize(e, corner); });
            })(handle, corners[i]);
            layer.appendChild(handle);
        }
        document.documentElement.appendChild(layer);
        this._handleLayer = layer;
        return layer;
    },

    // Corner-drag resize: live-previews via inline style, preserving the aspect
    // ratio of the current display size; on drag end persists width/height
    // attributes plus matching inline styles (the stylesheet's img{height:auto}
    // would otherwise override the height attribute) and reports the change.
    beginResize: function(e, corner) {
        var img = this._resizeImage;
        if (!img) return;
        e.preventDefault();
        e.stopPropagation();
        var rect = img.getBoundingClientRect();
        var startW = rect.width, startH = rect.height;
        if (!(startW > 0) || !(startH > 0)) return;
        var ratio = startW / startH;
        // The corner opposite the dragged one stays anchored.
        var anchorX = (corner === 'nw' || corner === 'sw') ? rect.right : rect.left;
        var handle = e.target;
        var lastW = Math.round(startW), lastH = Math.round(startH);
        try { handle.setPointerCapture(e.pointerId); } catch (ex) { /* synthetic events */ }

        var onMove = function(ev) {
            var w = Math.max(8, Math.round(Math.abs(ev.clientX - anchorX)));
            var h = Math.max(8, Math.round(w / ratio));
            lastW = w;
            lastH = h;
            img.style.width = w + 'px';
            img.style.height = h + 'px';
            OLWBridge.layoutResizeHandles();
        };
        var onUp = function() {
            handle.removeEventListener('pointermove', onMove);
            handle.removeEventListener('pointerup', onUp);
            handle.removeEventListener('pointercancel', onUp);
            img.setAttribute('width', lastW);
            img.setAttribute('height', lastH);
            img.style.width = lastW + 'px';
            img.style.height = lastH + 'px';
            OLWBridge.saveSelection();
            OLWBridge.reportState();
            postContentChanged();
            OLWBridge.layoutResizeHandles();
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
    },

    // Find and highlight the next occurrence of query using the browser's
    // native find. Returns true when a match is selected.
    findNext: function(query, matchCase) {
        if (!query) return false;
        try {
            return window.find(query, !!matchCase, false, true, false, false, false);
        } catch (e) {
            return false;
        }
    },

    // Find and highlight the previous occurrence (backwards native find).
    findPrevious: function(query, matchCase) {
        if (!query) return false;
        try {
            return window.find(query, !!matchCase, true, true, false, false, false);
        } catch (e) {
            return false;
        }
    },

    // Counts case-folded occurrences of needle in haystack (non-overlapping).
    _countInText: function(haystack, needle, matchCase) {
        if (!needle) return 0;
        var hay = matchCase ? haystack : haystack.toLowerCase();
        var ndl = matchCase ? needle : needle.toLowerCase();
        var count = 0, i = 0;
        while ((i = hay.indexOf(ndl, i)) >= 0) {
            count++;
            i += ndl.length;
        }
        return count;
    },

    // Counts matches across the editor body's text nodes (markup excluded).
    countMatches: function(query, matchCase) {
        if (!query) return 0;
        var count = 0;
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
        var node;
        while ((node = walker.nextNode())) {
            count += this._countInText(node.nodeValue || '', query, matchCase);
        }
        return count;
    },

    // Returns "current,total": the 1-based position of the selected match and the
    // total match count, for the find bar's "n of m" readout. current is 0 when
    // no match is currently selected.
    findStats: function(query, matchCase) {
        var total = this.countMatches(query, matchCase);
        var current = 0;
        var sel = window.getSelection();
        if (query && sel && sel.rangeCount > 0 && !sel.isCollapsed) {
            try {
                var range = sel.getRangeAt(0);
                var pre = document.createRange();
                pre.selectNodeContents(document.body);
                pre.setEnd(range.endContainer, range.endOffset);
                current = this._countInText(pre.toString(), query, matchCase);
            } catch (e) {
                current = 0;
            }
        }
        return current + ',' + total;
    },

    // Replaces the currently selected match (as highlighted by findNext/
    // findPrevious) with the given text, honoring the case option. Returns true
    // when a replacement was made; false when the selection is not a match.
    replaceCurrent: function(query, replacement, matchCase) {
        if (!query) return false;
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
        var text = sel.toString();
        var isMatch = matchCase
            ? text === query
            : text.toLowerCase() === query.toLowerCase();
        if (!isMatch) return false;
        document.execCommand('insertText', false, replacement || '');
        this.reportState();
        return true;
    },

    // Enable/disable the browser's native spell-check underlines on the editor body.
    // macOS/WebKit provides the actual checking and squiggly underlines; this just
    // toggles the contenteditable body's spellcheck attribute.
    setSpellcheck: function(enabled) {
        document.body.setAttribute('spellcheck', enabled ? 'true' : 'false');
        return document.body.getAttribute('spellcheck');
    },

    // Autoreplace toggles pushed from Preferences (Editing tab).
    _autoreplace: { smartQuotes: true, hyphens: true, special: true, emoticons: true },

    setAutoreplace: function(opts) {
        this._autoreplace = opts || {};
        return this._autoreplace;
    },

    _textBeforeCaret: function() {
        var sel = window.getSelection();
        if (!sel.rangeCount) return '';
        var range = sel.getRangeAt(0).cloneRange();
        range.collapse(true);
        range.setStart(document.body, 0);
        return range.toString();
    },

    _smartQuoteFor: function(plainQuote) {
        var before = this._textBeforeCaret();
        var isOpen = true;
        if (before.length > 0) {
            var prev = before[before.length - 1];
            if (prev === '-' || prev === '{' || prev === '[' || prev === '(') isOpen = true;
            else if (!/\s/.test(prev)) isOpen = false;
        }
        if (plainQuote === "'") return isOpen ? '\u2018' : '\u2019';
        return isOpen ? '\u201C' : '\u201D';
    },

    _handleTypographicKey: function(e) {
        var ar = this._autoreplace;
        if (!ar) return false;
        if ((e.key === '"' || e.key === "'") && ar.smartQuotes) {
            e.preventDefault();
            document.execCommand('insertText', false, this._smartQuoteFor(e.key));
            this.reportState();
            return true;
        }
        return false;
    },

    // Focus the editor
    focus: function() {
        document.body.focus();
    }
};

// Save selection whenever it changes (so we always have the latest)
document.addEventListener('selectionchange', function() {
    if (document.activeElement === document.body) {
        OLWBridge.saveSelection();
    }
    OLWBridge.updateResizeHandles();
    OLWBridge.reportState();
});

// Keep the resize handles glued to the selected image as the view moves.
document.addEventListener('scroll', function() { OLWBridge.layoutResizeHandles(); }, true);
window.addEventListener('resize', function() { OLWBridge.layoutResizeHandles(); });

// Track content changes. The host only needs to know THAT content changed (it
// pulls full HTML on demand via getContent), so post a lightweight debounced
// signal instead of the whole body innerHTML on every keystroke — with inline
// base64 images the full payload can be megabytes per keystroke.
var _contentChangedTimer = null;
function postContentChanged() {
    if (_contentChangedTimer) clearTimeout(_contentChangedTimer);
    _contentChangedTimer = setTimeout(function() {
        _contentChangedTimer = null;
        var msg = JSON.stringify({
            type: 'contentChanged',
            textLength: (document.body.innerText || '').length
        });
        OLWBridge.postToHost(msg);
    }, 400);
}

document.addEventListener('DOMContentLoaded', function() {
    document.body.addEventListener('keydown', function(e) {
        OLWBridge._handleTypographicKey(e);
    });
    document.body.addEventListener('input', postContentChanged);
    // Clicking an image selects it as a unit (like Windows Live Writer's
    // picture selection) so Picture Tools commands have a target; moving the
    // caret away deselects it via the selectionchange listener above.
    document.body.addEventListener('click', function(e) {
        if (e.target && e.target.tagName === 'IMG') {
            OLWBridge.selectImageUnit(e.target);
        }
    });
    // Right-clicking an image selects it as a unit and asks the host to open
    // the Picture properties dialog (Windows Live Writer parity).
    document.body.addEventListener('contextmenu', function(e) {
        if (e.target && e.target.tagName === 'IMG') {
            e.preventDefault();
            OLWBridge.selectImageUnit(e.target);
            OLWBridge.postToHost(JSON.stringify({ type: 'imageContextMenu' }));
        }
    });
});
</script>
</head>
<body contenteditable="true" spellcheck="true">
</body>
</html>
