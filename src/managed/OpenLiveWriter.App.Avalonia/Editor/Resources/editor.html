<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        padding: 20px 24px;
        min-height: 100vh;
        outline: none;
    }
    body:empty:before {
        content: 'Start writing your blog post...';
        color: #999;
        font-style: italic;
    }
    h1 { font-size: 2em; margin: 0.5em 0; font-weight: 600; }
    h2 { font-size: 1.5em; margin: 0.5em 0; font-weight: 600; }
    h3 { font-size: 1.25em; margin: 0.5em 0; font-weight: 600; }
    p { margin: 0.5em 0; }
    a { color: #0066cc; }
    blockquote {
        border-left: 3px solid #ddd;
        padding-left: 16px;
        margin: 1em 0;
        color: #666;
    }
    pre {
        background: #f5f5f5;
        padding: 12px 16px;
        border-radius: 4px;
        overflow-x: auto;
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 14px;
    }
    code {
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 0.9em;
    }
    img { max-width: 100%; height: auto; }
    ul, ol { padding-left: 24px; margin: 0.5em 0; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    td, th { border: 1px solid #ddd; padding: 8px 12px; }
    th { background: #f5f5f5; font-weight: 600; }
    hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
</style>
<script>
// OLW Editor Bridge - communicates between WebView and Avalonia app
// IMPORTANT: Script is in <head> so it doesn't contaminate body.innerHTML

var _savedSelection = null;

const OLWBridge = {
    // Save the current selection (call before focus leaves the editor)
    saveSelection: function() {
        var sel = window.getSelection();
        if (sel.rangeCount > 0) {
            _savedSelection = sel.getRangeAt(0).cloneRange();
        }
    },

    // Restore the saved selection and focus the editor
    restoreSelection: function() {
        document.body.focus();
        if (_savedSelection) {
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(_savedSelection);
        }
    },

    // Execute a formatting command (restores focus/selection first)
    execCommand: function(command, value) {
        this.restoreSelection();
        document.execCommand(command, false, value || null);
        this.saveSelection();
        this.reportState();
    },

    // Get current formatting state
    getState: function() {
        return JSON.stringify({
            bold: document.queryCommandState('bold'),
            italic: document.queryCommandState('italic'),
            underline: document.queryCommandState('underline'),
            strikethrough: document.queryCommandState('strikeThrough'),
            orderedList: document.queryCommandState('insertOrderedList'),
            unorderedList: document.queryCommandState('insertUnorderedList'),
            blockTag: document.queryCommandValue('formatBlock') || 'p'
        });
    },

    // Report state to native app via message passing
    reportState: function() {
        try {
            var stateMsg = JSON.stringify({
                type: 'stateChanged',
                state: JSON.parse(this.getState())
            });
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(stateMsg);
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.olwBridge) {
                window.webkit.messageHandlers.olwBridge.postMessage(stateMsg);
            }
        } catch(e) { /* silent */ }
    },

    // Get HTML content from the editor body
    getContent: function() {
        return document.body.innerHTML;
    },

    // Replace the editor body content with new HTML
    setContent: function(html) {
        document.body.innerHTML = html;
    },

    // Get plain text content
    getPlainText: function() {
        return document.body.innerText;
    },

    // Insert HTML at the current cursor position
    insertHtml: function(html) {
        this.restoreSelection();
        document.execCommand('insertHTML', false, html);
        this.saveSelection();
        this.reportState();
    },

    // Focus the editor
    focus: function() {
        document.body.focus();
    }
};

// Save selection whenever it changes (so we always have the latest)
document.addEventListener('selectionchange', function() {
    if (document.activeElement === document.body) {
        OLWBridge.saveSelection();
    }
    OLWBridge.reportState();
});

// Track content changes
document.addEventListener('DOMContentLoaded', function() {
    document.body.addEventListener('input', function() {
        try {
            var msg = JSON.stringify({ type: 'contentChanged', html: document.body.innerHTML });
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(msg);
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.olwBridge) {
                window.webkit.messageHandlers.olwBridge.postMessage(msg);
            }
        } catch(e) { /* silent */ }
    });
});
</script>
</head>
<body contenteditable="true" spellcheck="true">
</body>
</html>
